<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>EduGuide</title>
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="bright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- cap band -->
  <path d="M19 28 L32 37 L45 28 L45 35 L32 44 L19 35 Z"
        fill="url(#bright)" stroke="url(#bright)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- mortarboard -->
  <path d="M32 7 L56 20 L32 33 L8 20 Z"
        fill="url(#deep)" stroke="url(#deep)" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M32 15.5 L36.2 18.6 L27.8 18.6 Z" fill="#1E1B4B" opacity="0.5"/>
  <!-- tassel -->
  <path d="M55 20 L55 28.5" stroke="url(#deep)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M55 28 C57.5 30.5 58.4 32.7 58.4 34.4 C58.4 36.7 56.9 38.2 55 38.2 C53.1 38.2 51.6 36.7 51.6 34.4 C51.6 32.7 52.5 30.5 55 28 Z"
        fill="url(#deep)"/>
  <!-- book covers -->
  <path d="M9 48 L9 57.5 C15.5 57.5 22.5 59 27.8 61.8"
        fill="none" stroke="url(#deep)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M55 48 L55 57.5 C48.5 57.5 41.5 59 36.2 61.8"
        fill="none" stroke="url(#bright)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- book pages -->
  <path d="M30 50.4 C25.4 47.4 19.6 46.4 13.6 46.4 L13.6 54.6 C19.6 54.6 25.4 55.8 30 58.8 Z" fill="url(#deep)"/>
  <path d="M34 50.4 C38.6 47.4 44.4 46.4 50.4 46.4 L50.4 54.6 C44.4 54.6 38.6 55.8 34 58.8 Z" fill="url(#bright)"/>
</svg>
